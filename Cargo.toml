[package]
name = "internet-radio-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
mcp-core = { git = "https://github.com/adelie-ai/mcp-core" }
nix = { version = "0.31.3", features = ["signal"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
# Structured diagnostics: debug! on outbound Radio Browser / stream calls, and
# #[instrument] on the tool handlers. Already in the tree through mcp-core's
# adelie-telemetry dependency, so naming it directly adds no crate.
tracing = "0.1.44"

[dev-dependencies]
# A capturing layer for the telemetry acceptance tests: they read back the
# spans and events the dispatch path really produced. Already in the tree
# through mcp-core's adelie-telemetry dependency, so this adds no crate.
tracing-subscriber = "0.3.23"
# Mocks the Radio Browser directory at the HTTP boundary so tests never reach
# the live directory or a live stream (mcp-core#40).
httpmock = "0.8.3"

[features]
# OTLP export of traces, metrics and log records, off by default. A pure
# passthrough: server -> mcp-core -> adelie-telemetry, so this crate takes no
# direct dependency on adelie-telemetry or on any opentelemetry crate. With
# the feature off, cargo tree resolves no opentelemetry crate at all.
# Configure export with the standard OTEL_* environment variables -- see
# mcp-core's README for the full list.
otel = ["mcp-core/otel"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
